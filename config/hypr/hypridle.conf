# ===== hypridle 空闲管理配置 =====
# 只做一件事：空闲 10 分钟关显示器，动鼠标/键盘自动亮回来。
# 本仓库不包含锁屏（没有 hyprlock 配置），所以这里不设 lock_cmd。

general {
}

# 空闲 10 分钟后关闭显示器（注意：注释里原来的 "5 分钟" 是历史笔误，timeout 单位是秒）
listener {
    timeout = 600
    on-timeout = $HOME/.config/hypr/scripts/hypr-dpms.sh off    # 熄屏
    on-resume = $HOME/.config/hypr/scripts/hypr-dpms.sh on      # 动鼠标键盘后亮屏
}
